{{- if and .Values.rbac .Values.rbac.create .Values.rbac.rules }}
{{- if eq (include "serviceAccountName" .) "default" }}
{{- fail "rbac.create: the Role would be bound to the namespace's `default` ServiceAccount (every pod using it would get these rules). Set serviceAccount.create: true or a non-default serviceAccount.name." }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "application.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
rules:
{{ toYaml .Values.rbac.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "application.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "application.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "serviceAccountName" . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
