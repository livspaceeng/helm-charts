name: Release Charts

on:
  push:
    branches:
      - master
      - next
    paths:
      - "charts/**"

jobs:
  release:
    # self-hosted-gke (gke-keystone) for Workload Identity to Artifact Registry;
    # see .github/scripts/oci-push.sh.
    runs-on: [self-hosted, self-hosted-gke]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Set up Helm
        uses: azure/setup-helm@v4.1.0
#        with:
#          version: v4.1.0

      - name: Set up Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami/
          helm repo add haproxytech https://haproxytech.github.io/helm-charts
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_repo_url: https://charts.livspace.com
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # chart-releaser leaves the charts it released in .cr-release-packages.
      # Argo CD pulls from the OCI repo; charts.livspace.com stays for helm repo
      # users until every kustomization has moved.
      - name: Push released charts to Artifact Registry (OCI)
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No charts released in this push"
            exit 0
          fi
          .github/scripts/oci-push.sh "${pkgs[@]}"
